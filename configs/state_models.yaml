logging:
  level: INFO

storage:
  cache_dir: artifacts/cache
  output_dir: artifacts/latest

universe:
  equities:
    - SPY
    - AAPL
  crypto:
    - BTC-USD
    - ETH-USD

data:
  historical_provider: yfinance
  live_provider: mock
  start_date: 2023-01-01
  end_date:
  interval: 1d
  adjust_prices: true
  use_cache: true
  min_history_bars: 220

features:
  return_horizons: [1, 3, 5, 10, 20, 60]
  atr_window: 14
  volatility_window: 20
  rsi_window: 14
  moving_average_windows: [10, 20, 50, 200]
  zscore_window: 20
  volume_window: 20
  return_zscore_window: 20
  acceleration_pairs: [[3, 10], [5, 20], [20, 60]]
  bars_per_year_equity: 252
  bars_per_year_crypto: 365

states:
  model_name: composite_rule
  trend_threshold: 0.01
  volatility_zscore_threshold: 0.5
  momentum_threshold: 0.02
  extension_threshold: 1.5
  rsi_overbought: 70
  rsi_oversold: 30
  short_horizon: 5
  medium_horizon: 20
  long_horizon: 60
  acceleration_threshold: 0.002
  vol_regime_threshold: 0.15
  atr_move_threshold: 1.0
  return_zscore_threshold: 1.0
  volume_expansion_threshold: 1.25
  volume_contraction_threshold: 0.8
  persistence_thresholds: [3, 10]
  rich_components: [trend, volatility, acceleration, extension, volume, persistence]
  bin_features: [return_5, return_20, realized_vol_20, ma_gap_50, rsi_14, volume_ratio_20]
  bin_count: 3
  binning_strategy: quantile
  bin_feature_bin_counts:
    realized_vol_20: 2
    rsi_14: 2
    volume_ratio_20: 2
    bin_group_trend_composite: 3
  bin_feature_groups:
    - name: trend_composite
      features: [return_5, return_20, ma_gap_20, ma_gap_50]
      reducer: mean_zscore
      replace_members: true
  bin_merge_sparse_states: true
  bin_min_state_observations: 18
  bin_merge_order: [volume_ratio_20, rsi_14, realized_vol_20, bin_group_trend_composite]
  bin_merge_label: any
  cluster_features: [return_5, return_20, return_60, realized_vol_20, vol_regime_20, ma_gap_20, ma_gap_50, ma_gap_200, rsi_14, volume_ratio_20, trend_persistence]
  cluster_count: 6
  cluster_random_state: 7
  cluster_n_init: 20
  cluster_max_iter: 300
  cluster_min_size: 18
  cluster_merge_small_clusters: true
  cluster_dimensionality_reduction: pca
  cluster_pca_components: 4
  hybrid_anchor: trend
  hybrid_cluster_count: 3
  hybrid_min_regime_samples: 55
  contextualize_states: false
  append_previous_state: false
  previous_state_mode: group
  append_state_age_bucket: false
  duration_buckets: [3, 10]
  append_recent_path: false
  recent_path_length: 2
  append_entry_bias: false
  rich_collapse_rsi_zones: true
  rich_collapse_volatility_regimes: true
  rich_collapse_momentum_regimes: true
  rich_merge_sparse_states: true
  rich_min_state_observations: 18
  rich_merge_order: [persistence, volume, extension, acceleration]
  rich_merge_label: any
  sparse_state_warning_threshold: 12

markov:
  transition_horizon_bars: 1
  forward_return_horizon_bars: 5
  min_state_observations: 15
  laplace_smoothing: 1.0
  transition_lookback_bars: 126

signals:
  min_training_bars: 90
  min_expected_value: 0.0005
  min_confidence: 0.05
  transaction_cost_bps: 5.0
  slippage_bps: 5.0
  volatility_penalty: 0.08
  liquidity_threshold: 1000000
  liquidity_penalty: 0.001
  allow_short_equities: false
  allow_short_crypto: true

risk:
  initial_capital: 100000
  max_position_pct: 0.15
  max_gross_exposure: 1.0
  max_concurrent_positions: 4
  stop_atr_multiple: 2.0
  max_daily_loss_pct: 0.03
  volatility_target:

backtest:
  hold_bars: 5
  exit_on_state_change: true
  exit_on_signal_flip: true
  commission_bps: 2.0
  slippage_bps_equity: 2.0
  slippage_bps_crypto: 5.0
  annualization_factor: 252

execution:
  paper_enabled: true
  broker_name: paper
  journal_dir: artifacts/latest/paper

dashboard:
  artifacts_dir: artifacts/latest

research:
  walk_forward:
    enabled: true
    train_bars: 140
    validation_bars: 35
    test_bars: 35
    step_bars: 35
    refit_on_validation_for_test: true
    minimum_symbol_train_bars: 90
  parameter_sweep:
    enabled: false
    search_space: {}
    max_combinations: 16
    rank_metric: mean_test_sharpe
    top_k: 10
  diagnostics:
    top_n_trades: 15
    min_group_observations: 3
  state_model_comparison:
    enabled: true
    models:
      - name: legacy_rule
        description: Original coarse trend and volatility composite state.
        overrides:
          states.model_name: composite_rule
      - name: rich_rule_dense
        description: Rich composite state with collapsed branches and sparse-state merging.
        overrides:
          states.model_name: rich_composite_rule
          states.contextualize_states: false
          states.rich_components:
            - trend
            - volatility
            - acceleration
            - extension
            - persistence
      - name: feature_bins_dense
        description: Feature-bin states with grouped trend composites and automatic sparse merging.
        overrides:
          states.model_name: feature_bins
          states.contextualize_states: false
      - name: kmeans_pruned
        description: K-means clustering with PCA and small-cluster merging.
        overrides:
          states.model_name: kmeans
          states.cluster_count: 6
          states.contextualize_states: false
      - name: hybrid_trend_kmeans
        description: Trend-regime first, then local K-means inside each coarse regime.
        overrides:
          states.model_name: hybrid_regime_kmeans
          states.hybrid_anchor: trend
          states.hybrid_cluster_count: 3

asset_overrides:
  equity:
    states:
      trend_threshold: 0.008
      momentum_threshold: 0.015
      sparse_state_warning_threshold: 10
      cluster_features: [return_5, return_20, realized_vol_20, ma_gap_20, ma_gap_50, rsi_14, volume_ratio_20, trend_persistence]
      cluster_pca_components: 3
      hybrid_anchor: trend
      bin_features: [realized_vol_20, rsi_14, volume_ratio_20]
    signals:
      volatility_penalty: 0.08
      min_expected_value: 0.0005
    risk:
      stop_atr_multiple: 2.0
  crypto:
    states:
      trend_threshold: 0.015
      momentum_threshold: 0.03
      extension_threshold: 1.8
      sparse_state_warning_threshold: 10
      cluster_features: [return_5, return_20, return_60, realized_vol_20, vol_regime_20, ma_gap_20, rsi_14, volume_ratio_20, trend_persistence]
      cluster_count: 5
      cluster_pca_components: 4
      hybrid_anchor: volatility
      bin_features: [return_20, realized_vol_20, rsi_14, volume_ratio_20]
    markov:
      transition_lookback_bars: 90
    signals:
      volatility_penalty: 0.12
      liquidity_penalty: 0.0015
      min_expected_value: 0.001
    risk:
      stop_atr_multiple: 2.5
